  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;ai-midterm-visual-lab&#x27;);
  const order = [&#x27;route&#x27;,&#x27;search&#x27;,&#x27;puzzle&#x27;,&#x27;game&#x27;,&#x27;peas&#x27;,&#x27;theory&#x27;,&#x27;test&#x27;];
  let currentSection = &#x27;route&#x27;;
  const completed = new Set();

  const dots = root.querySelector(&#x27;#section-dots&#x27;);
  order.forEach(name =&gt; dots.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;span class=&quot;section-dot&quot; data-dot=&quot;${name}&quot;&gt;&lt;/span&gt;`));
  function showSection(name, markCurrent = false) {
    if (markCurrent) completed.add(currentSection);
    currentSection = name;
    root.querySelectorAll(&#x27;.lab-section&#x27;).forEach(section =&gt; section.hidden = section.dataset.section !== name);
    root.querySelectorAll(&#x27;[data-go]&#x27;).forEach(button =&gt; {
      const active = button.dataset.go === name;
      button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
      button.dataset.done = String(completed.has(button.dataset.go));
    });
    root.querySelectorAll(&#x27;.section-dot&#x27;).forEach(dot =&gt; {
      dot.classList.toggle(&#x27;current&#x27;, dot.dataset.dot === name);
      dot.classList.toggle(&#x27;done&#x27;, completed.has(dot.dataset.dot));
    });
    const index = order.indexOf(name);
    root.querySelector(&#x27;#section-prev&#x27;).disabled = index === 0;
    root.querySelector(&#x27;#section-next&#x27;).textContent = index === order.length - 1 ? &#x27;Finish ✓&#x27; : &#x27;Next section →&#x27;;
  }
  root.querySelectorAll(&#x27;[data-go]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showSection(button.dataset.go)));
  root.querySelectorAll(&#x27;[data-route-target]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showSection(button.dataset.routeTarget, true)));
  root.querySelector(&#x27;#section-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showSection(order[Math.max(0, order.indexOf(currentSection)-1)]));
  root.querySelector(&#x27;#section-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const index = order.indexOf(currentSection);
    completed.add(currentSection);
    if (index &lt; order.length-1) showSection(order[index+1]);
    else {
      showSection(&#x27;test&#x27;);
      root.querySelector(&#x27;#quiz-feedback&#x27;).textContent = completed.size === order.length ? &#x27;Every section visited. Finish the test and review only your misses.&#x27; : &#x27;Complete the test, then revisit weak sections.&#x27;;
    }
  });

  const positions = {S:[55,150],A:[205,55],B:[205,150],C:[205,245],D:[420,75],E:[420,195],G:[660,150]};
  const heuristics = {S:6,A:5,B:4,C:1,D:3,E:2,G:0};
  const edges = [[&#x27;S&#x27;,&#x27;A&#x27;,2],[&#x27;S&#x27;,&#x27;B&#x27;,5],[&#x27;S&#x27;,&#x27;C&#x27;,9],[&#x27;A&#x27;,&#x27;B&#x27;,1],[&#x27;A&#x27;,&#x27;D&#x27;,4],[&#x27;B&#x27;,&#x27;D&#x27;,1],[&#x27;B&#x27;,&#x27;E&#x27;,3],[&#x27;C&#x27;,&#x27;G&#x27;,1],[&#x27;D&#x27;,&#x27;G&#x27;,3],[&#x27;E&#x27;,&#x27;G&#x27;,2]];
  const adjacency = {}; Object.keys(positions).forEach(node =&gt; adjacency[node]=[]); edges.forEach(([a,b,c]) =&gt; adjacency[a].push([b,c]));
  const graph = root.querySelector(&#x27;#search-graph&#x27;);
  graph.innerHTML = &#x27;&lt;defs&gt;&lt;marker id=&quot;lab-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0 0 L10 5 L0 10z&quot; fill=&quot;var(--border)&quot;&gt;&lt;/path&gt;&lt;/marker&gt;&lt;/defs&gt;&#x27;;
  edges.forEach(([a,b,c],i) =&gt; {
    const [x1,y1]=positions[a], [x2,y2]=positions[b];
    const curved=a===&#x27;C&#x27;&amp;&amp;b===&#x27;G&#x27;;
    const path=curved?`M${x1+22} ${y1+9} Q450 306 ${x2-24} ${y2+13}`:`M${x1+25} ${y1} L${x2-27} ${y2}`;
    const labelX=curved?455:(x1+x2)/2, labelY=curved?281:(y1+y2)/2-7;
    graph.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;path class=&quot;search-edge&quot; data-edge=&quot;${a}-${b}&quot; d=&quot;${path}&quot; marker-end=&quot;url(#lab-arrow)&quot;&gt;&lt;/path&gt;&lt;text class=&quot;graph-label text-small&quot; x=&quot;${labelX}&quot; y=&quot;${labelY}&quot;&gt;${c}&lt;/text&gt;`);
  });
  Object.entries(positions).forEach(([node,[x,y]]) =&gt; graph.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;g class=&quot;graph-node${node===&#x27;G&#x27;?&#x27; goal&#x27;:&#x27;&#x27;}&quot; data-node=&quot;${node}&quot; transform=&quot;translate(${x},${y})&quot;&gt;&lt;circle r=&quot;27&quot;&gt;&lt;/circle&gt;&lt;text y=&quot;-5&quot;&gt;${node}&lt;/text&gt;&lt;text class=&quot;text-small&quot; y=&quot;13&quot;&gt;h=${heuristics[node]}&lt;/text&gt;&lt;/g&gt;`));
  let searchState, autoTimer;
  function searchPriority(item, alg) {
    if (alg===&#x27;bfs&#x27;) return item.depth;
    if (alg===&#x27;dfs&#x27;) return -item.depth;
    if (alg===&#x27;ucs&#x27;) return item.g;
    if (alg===&#x27;gbfs&#x27;) return heuristics[item.node];
    return item.g + heuristics[item.node];
  }
  function sortSearch() {
    const alg=root.querySelector(&#x27;#search-algorithm&#x27;).value;
    searchState.frontier.sort((a,b) =&gt; searchPriority(a,alg)-searchPriority(b,alg) || a.node.localeCompare(b.node));
  }
  function searchLabel(item) {
    const alg=root.querySelector(&#x27;#search-algorithm&#x27;).value;
    if (alg===&#x27;ucs&#x27;) return `${item.node} · g${item.g}`;
    if (alg===&#x27;gbfs&#x27;) return `${item.node} · h${heuristics[item.node]}`;
    if (alg===&#x27;astar&#x27;) return `${item.node} · f${item.g+heuristics[item.node]}`;
    return item.node;
  }
  function renderSearch(message) {
    sortSearch();
    const frontier=root.querySelector(&#x27;#frontier-chips&#x27;), explored=root.querySelector(&#x27;#explored-chips&#x27;);
    frontier.innerHTML = searchState.frontier.length ? searchState.frontier.map((item,i)=&gt;`&lt;span class=&quot;state-chip${i===0?&#x27; next-chip&#x27;:&#x27;&#x27;}&quot;&gt;${searchLabel(item)}&lt;/span&gt;`).join(&#x27;&#x27;) : &#x27;&lt;span class=&quot;text-muted&quot;&gt;empty&lt;/span&gt;&#x27;;
    explored.innerHTML = searchState.explored.size ? [...searchState.explored].map(node=&gt;`&lt;span class=&quot;state-chip&quot;&gt;${node}&lt;/span&gt;`).join(&#x27;&#x27;) : &#x27;&lt;span class=&quot;text-muted&quot;&gt;none&lt;/span&gt;&#x27;;
    root.querySelectorAll(&#x27;.graph-node&#x27;).forEach(el =&gt; {
      el.classList.toggle(&#x27;explored&#x27;,searchState.explored.has(el.dataset.node));
      el.classList.toggle(&#x27;current&#x27;,el.dataset.node===searchState.frontier[0]?.node);
    });
    root.querySelectorAll(&#x27;.search-edge&#x27;).forEach(el =&gt; el.classList.toggle(&#x27;active&#x27;,searchState.pathEdges.has(el.dataset.edge)));
    root.querySelector(&#x27;#search-detail&#x27;).textContent = message;
  }
  function resetSearch() {
    clearInterval(autoTimer); autoTimer=null;
    root.querySelector(&#x27;#search-auto&#x27;).textContent=&#x27;Auto&#x27;;
    searchState={frontier:[{node:&#x27;S&#x27;,g:0,depth:0,path:[&#x27;S&#x27;]}],explored:new Set(),pathEdges:new Set(),finished:false};
    renderSearch(&#x27;Predict the first node: every algorithm starts by popping S.&#x27;);
  }
  function searchStep() {
    if (searchState.finished) return;
    sortSearch(); const alg=root.querySelector(&#x27;#search-algorithm&#x27;).value; const current=searchState.frontier.shift();
    if (!current) { searchState.finished=true; renderSearch(&#x27;Frontier empty: no solution.&#x27;); return; }
    if (searchState.explored.has(current.node)) { searchStep(); return; }
    searchState.explored.add(current.node);
    if (current.path.length&gt;1) searchState.pathEdges.add(`${current.path.at(-2)}-${current.node}`);
    if (current.node===&#x27;G&#x27;) {
      searchState.finished=true; clearInterval(autoTimer); autoTimer=null;
      renderSearch(`Goal popped · ${current.path.join(&#x27; → &#x27;)} · actual cost ${current.g}`); return;
    }
    adjacency[current.node].slice().sort((a,b)=&gt;a[0].localeCompare(b[0])).forEach(([node,cost]) =&gt; {
      if (searchState.explored.has(node)) return;
      const candidate={node,g:current.g+cost,depth:current.depth+1,path:[...current.path,node]};
      const existing=searchState.frontier.find(item=&gt;item.node===node);
      if (!existing) searchState.frontier.push(candidate);
      else if ((alg===&#x27;ucs&#x27;||alg===&#x27;astar&#x27;) &amp;&amp; candidate.g&lt;existing.g) Object.assign(existing,candidate);
    });
    const rule={bfs:&#x27;shallowest depth&#x27;,dfs:&#x27;deepest depth&#x27;,ucs:&#x27;lowest g&#x27;,gbfs:&#x27;lowest h&#x27;,astar:&#x27;lowest g+h&#x27;}[alg];
    renderSearch(`Expanded ${current.node} at g=${current.g}. Next = ${rule}.`);
  }
  root.querySelector(&#x27;#search-next&#x27;).addEventListener(&#x27;click&#x27;,searchStep);
  root.querySelector(&#x27;#search-reset&#x27;).addEventListener(&#x27;click&#x27;,resetSearch);
  root.querySelector(&#x27;#search-algorithm&#x27;).addEventListener(&#x27;change&#x27;,resetSearch);
  root.querySelector(&#x27;#search-auto&#x27;).addEventListener(&#x27;click&#x27;,() =&gt; {
    if (autoTimer) { clearInterval(autoTimer); autoTimer=null; root.querySelector(&#x27;#search-auto&#x27;).textContent=&#x27;Auto&#x27;; }
    else { autoTimer=setInterval(()=&gt;{searchStep();if(searchState.finished){clearInterval(autoTimer);autoTimer=null;}},700);root.querySelector(&#x27;#search-auto&#x27;).textContent=&#x27;Pause&#x27;; }
  });
  resetSearch();

  const initialPuzzle=[2,8,3,1,6,4,7,0,5], goalPuzzle=[1,2,3,8,0,4,7,6,5];
  let puzzleState=[...initialPuzzle], puzzleMode=&#x27;h1&#x27;, selectedTile=null;
  function tileDistance(tile, state) {
    if (!tile) return 0; const from=state.indexOf(tile), to=goalPuzzle.indexOf(tile);
    return Math.abs(Math.floor(from/3)-Math.floor(to/3))+Math.abs(from%3-to%3);
  }
  function renderBoard(element,state,interactive) {
    element.innerHTML=&#x27;&#x27;;
    state.forEach(tile =&gt; {
      if (!tile) { element.insertAdjacentHTML(&#x27;beforeend&#x27;,&#x27;&lt;span class=&quot;puzzle-tile blank&quot; role=&quot;gridcell&quot; aria-label=&quot;blank&quot;&gt;&lt;/span&gt;&#x27;); return; }
      const contribution=puzzleMode===&#x27;h1&#x27; ? Number(state.indexOf(tile)!==goalPuzzle.indexOf(tile)) : tileDistance(tile,state);
      const cls=`puzzle-tile${contribution?&#x27; contributes&#x27;:&#x27;&#x27;}${selectedTile===tile?&#x27; selected&#x27;:&#x27;&#x27;}`;
      const content=`&lt;span&gt;${tile}&lt;/span&gt;&lt;span class=&quot;tile-cost text-small&quot;&gt;+${contribution}&lt;/span&gt;`;
      element.insertAdjacentHTML(&#x27;beforeend&#x27;, interactive ? `&lt;button type=&quot;button&quot; class=&quot;${cls}&quot; data-tile=&quot;${tile}&quot; role=&quot;gridcell&quot; aria-label=&quot;Tile ${tile}, contribution ${contribution}&quot;&gt;${content}&lt;/button&gt;` : `&lt;span class=&quot;${cls}&quot; role=&quot;gridcell&quot;&gt;${content}&lt;/span&gt;`);
    });
  }
  function renderPuzzle(message) {
    renderBoard(root.querySelector(&#x27;#puzzle-board&#x27;),puzzleState,true); renderBoard(root.querySelector(&#x27;#goal-board&#x27;),goalPuzzle,false);
    const contributions=puzzleState.filter(Boolean).map(tile=&gt;[tile,puzzleMode===&#x27;h1&#x27;?Number(puzzleState.indexOf(tile)!==goalPuzzle.indexOf(tile)):tileDistance(tile,puzzleState)]).filter(item=&gt;item[1]);
    const total=contributions.reduce((sum,item)=&gt;sum+item[1],0);
    root.querySelector(&#x27;#puzzle-score-label&#x27;).textContent=puzzleMode===&#x27;h1&#x27;?&#x27;Misplaced tiles&#x27;:&#x27;Manhattan sum&#x27;;
    root.querySelector(&#x27;#puzzle-score&#x27;).textContent=total;
